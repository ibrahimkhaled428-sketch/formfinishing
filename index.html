<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFE8DE; --surface:#F8F4EE; --ink:#3F3922; --olive:#5C5538; --olive-deep:#4F4629;
    --copper:#9C7151; --copper-soft:#C8AC96; --line:#D8CCBC; --muted:#7A7260; --error:#A3432F;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans Arabic',Tahoma,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
  .app{min-height:100vh;min-height:100dvh;max-width:560px;margin:0 auto;padding:20px 22px 24px;display:flex;flex-direction:column}

  /* هيدر الأسئلة */
  .brandrow{display:flex;align-items:center;gap:12px}
  .brandrow img{width:38px;height:auto}
  .brand{font-size:14px;font-weight:500;line-height:1.35;color:var(--olive-deep)}
  .brand small{display:block;font-size:12px;font-weight:400;color:var(--muted)}

  /* خط التقدم: خط أبعاد معماري */
  .dim{position:relative;height:16px;margin:22px 0 0}
  .dim::before{content:'';position:absolute;right:0;left:0;top:50%;border-top:1px solid var(--copper-soft)}
  .dim .tick{position:absolute;top:2px;width:1px;height:12px;background:var(--copper-soft)}
  .dim .s{right:0;background:var(--copper)}
  .dim .e{left:0}
  .dim .fill{position:absolute;right:0;top:calc(50% - 1px);height:2px;width:0;background:var(--copper);transition:width .4s ease}
  .dim .fill::after{content:'';position:absolute;left:0;top:-5px;width:1px;height:12px;background:var(--copper)}

  .view{flex:1;display:flex;flex-direction:column}
  main{flex:1;padding-top:34px}
  .q{font-size:clamp(23px,6vw,29px);font-weight:600;line-height:1.5;color:var(--olive-deep)}
  .help{margin-top:8px;font-size:15px;line-height:1.75;color:var(--muted)}

  input,textarea{width:100%;font:inherit;font-size:20px;color:var(--ink);background:transparent;border:0;border-bottom:1.5px solid var(--line);border-radius:0;padding:10px 2px;outline:none;transition:border-color .15s}
  input:focus,textarea:focus{border-color:var(--olive)}
  input::placeholder,textarea::placeholder{color:#B3A894}
  input[dir=ltr]{text-align:right}
  textarea{min-height:130px;resize:vertical;font-size:17px;line-height:1.7;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
  .field{margin-top:30px}

  .options{margin-top:28px;display:grid;gap:10px}
  .opt{display:flex;align-items:center;gap:14px;width:100%;text-align:right;font:inherit;font-size:17px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
  .opt:hover{border-color:var(--copper-soft)}
  .opt .mark{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--copper-soft)}
  .opt[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:var(--surface)}
  .opt[aria-pressed="true"] .mark{border-color:var(--surface);box-shadow:inset 0 0 0 4px var(--olive);background:var(--surface)}
  .other{margin-top:4px}

  .err{min-height:22px;margin-top:12px;font-size:14px;color:var(--error)}

  footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:20px}
  .btn{font:inherit;font-size:17px;font-weight:500;color:var(--surface);background:var(--olive);border:0;border-radius:999px;padding:14px 32px;cursor:pointer;transition:background .15s}
  .btn:hover{background:var(--olive-deep)}
  .btn:disabled{opacity:.55;cursor:default}
  .back{font:inherit;font-size:15px;color:var(--muted);background:none;border:0;padding:10px 4px;cursor:pointer}
  .back:hover{color:var(--olive-deep)}
  [hidden]{display:none!important}
  :focus-visible{outline:2px solid var(--copper);outline-offset:3px}

  /* شاشة البداية والنهاية */
  .center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px 4px}
  .center img{width:132px;height:auto;margin-bottom:30px}
  .center h1{font-size:clamp(26px,7vw,34px);font-weight:600;line-height:1.45;color:var(--olive-deep)}
  .center p{max-width:30ch;margin-top:12px;font-size:17px;line-height:1.8;color:var(--muted)}
  .center .btn{margin-top:34px;padding:15px 56px}
  .center .fine{margin-top:14px;font-size:13px}
  .sig{margin-top:auto;padding-top:28px;font-size:13px;color:var(--muted);text-align:center}

  .screen{animation:in .25s ease}
  @keyframes in{from{opacity:0;transform:translateY(6px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header id="hdr" hidden>
    <div class="brandrow">
      <img class="logo" alt="">
      <div class="brand">م. إبراهيم الشلقاني<small>تصميم داخلي وتشطيبات</small></div>
    </div>
    <div class="dim" aria-hidden="true"><span class="tick s"></span><span class="fill" id="fill"></span><span class="tick e"></span></div>
  </header>
  <div class="view" id="view"></div>
</div>

  {id:'floor', type:'choice', q:'الوحدة في الدور الكام؟', options:['أرضي','من 1 لـ 3','من 4 لـ 7','8 وأعلى'], when:isRes},
  {id:'elevator', type:'choice', q:'فيه أسانسير شغال؟', options:['آه','لأ'], when:d => isRes(d) && d.floor && d.floor !== 'أرضي'},
  {id:'status', type:'choice', q:'الوحدة حالتها إيه دلوقتي؟', options:['طوب أحمر','نص تشطيب','إعادة تشطيب'], other:'مرحلة أخرى', when:isRes},
  {id:'unitType', type:'choice', q:'نوع الوحدة إيه؟', options:['شقة','دوبلكس','بنتهاوس','فيلا / تاون هاوس'], when:isRes},
  {id:'notes', type:'textarea', q:'فيه تفاصيل تانية تحب تقولها؟', optional:true, when:isCom},
  {id:'wantsQuote', type:'choice', q:'تحب أجهزلك تسعير مبدئي؟', help:'بياخد دقيقة كمان. ولو تحب نتكلم الأول، اختار كلمني.', options:[YES_QUOTE,'لأ، كلمني'], when:isRes},
  {id:'budget', type:'choice', q:'الميزانية المتاحة في حدود كام؟', options:['أقل من 500,000 جنيه','من 500,000 لـ 1,000,000 جنيه','أكتر من 1,000,000 جنيه','مرنة حسب اختياراتي'],
    when:d => isRes(d) && d.wantsQuote === YES_QUOTE}
];

/* ====== المنطق ====== */
const view = document.getElementById('view');
const hdr = document.getElementById('hdr');
const fill = document.getElementById('fill');
document.querySelectorAll('.logo').forEach(i => i.src = LOGO);

let data = {}, stack = [], curId = null, busy = false;

function normDigits(v){
  return v.replace(/[٠-٩]/g, c => '٠١٢٣٤٥٦٧٨٩'.indexOf(c))
          .replace(/[۰-۹]/g, c => '۰۱۲۳۴۵۶۷۸۹'.indexOf(c))
          .replace(/[\s,،.\-]/g, '');
}
function normPhone(v){
  v = normDigits(v).replace(/^\+/, '').replace(/^00/, '');
  if (/^20\d{10}$/.test(v)) v = '0' + v.slice(2);
  return v;
}
const shown = s => !s.when || s.when(data);
const step = id => STEPS.find(s => s.id === id);
const text = (s, k) => typeof s[k] === 'function' ? s[k](data) : s[k];

function nextId(fromId){
  let i = fromId ? STEPS.findIndex(s => s.id === fromId) + 1 : 0;
  for (; i < STEPS.length; i++) if (shown(STEPS[i])) return STEPS[i].id;
  return null;
}
function go(id){ if (curId) stack.push(curId); curId = id; render(); }
function forward(){ const n = nextId(curId); n ? go(n) : submit(); }
function back(){ if (stack.length){ curId = stack.pop(); render(); } else intro(); }

function intro(){
  curId = null; stack = []; hdr.hidden = true;
  view.innerHTML = `
    <section class="center screen">
      <img src="${LOGO}" alt="Eng Ibrahim El-Shalaqany">
      <h1>خلّينا نعرف وحدتك</h1>
      <p>كام سؤال سريع، وبعدها هتواصل معاك بنفسي. ولو حبيت، أجهزلك تسعير مبدئي.</p>
      <button class="btn" type="button" id="start">ابدأ</button>
      <p class="fine">حوالي دقيقتين</p>
    </section>`;
  document.getElementById('start').onclick = () => go(nextId(null));
}

function render(){
  const s = step(curId);
  const list = STEPS.filter(shown);
  hdr.hidden = false;
  fill.style.width = Math.round(list.indexOf(s) / list.length * 100) + '%';
  const last = !nextId(s.id);
  busy = false;

  view.innerHTML = `
    <main class="screen">
      <h1 class="q" id="q"></h1>
      <p class="help" id="help" hidden></p>
      <div id="body"></div>
      <p class="err" id="err" role="alert"></p>
    </main>
    <footer>
      <button class="back" type="button" id="back">رجوع</button>
      <button class="btn" type="button" id="next">${last ? 'ابعت الطلب' : 'التالي'}</button>
    </footer>`;
  document.getElementById('q').textContent = text(s, 'q');
  const helpTxt = [text(s, 'help'), s.optional ? 'اختياري.' : ''].filter(Boolean).join(' ');
  if (helpTxt){ const h = document.getElementById('help'); h.textContent = helpTxt; h.hidden = false; }

  const body = document.getElementById('body');
  const next = document.getElementById('next');
  document.getElementById('back').onclick = back;
  next.onclick = () => { if (commit(s)) forward(); };

  if (s.type === 'choice') buildChoice(s, body, next, last);
  else buildInput(s, body, next, last);
}

function buildInput(s, body, next, last){
  body.className = 'field';
  const el = document.createElement(s.type === 'textarea' ? 'textarea' : 'input');
  if (s.type !== 'textarea'){
    el.type = 'text';
    if (s.type === 'tel'){ el.inputMode = 'tel'; el.dir = 'ltr'; el.autocomplete = 'tel'; }
    if (s.type === 'number'){ el.inputMode = 'numeric'; el.dir = 'ltr'; }
    if (s.ac) el.autocomplete = s.ac;
    el.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); next.click(); } });
  }
  el.placeholder = s.ph || '';
  el.value = data[s.id] || '';
  el.setAttribute('aria-labelledby', 'q');
  body.appendChild(el);
  const label = () => { if (s.optional && !last) next.textContent = el.value.trim() ? 'التالي' : 'تخطي'; };
  el.addEventListener('input', () => { setErr(''); label(); });
  label();
  setTimeout(() => el.focus(), 60);
}

function buildChoice(s, body, next, last){
  body.className = 'options';
  body.setAttribute('role', 'group');
  body.setAttribute('aria-labelledby', 'q');
  const otherKey = s.id + '__other';
  const otherOn = !!data[otherKey];

  const btn = (label, pressed, onPick) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'opt';
    b.setAttribute('aria-pressed', pressed);
    b.innerHTML = '<span class="mark"></span><span></span>';
    b.lastChild.textContent = label;
    b.onclick = onPick;
    body.appendChild(b);
    return b;
  };
  const press = target => body.querySelectorAll('.opt').forEach(b => b.setAttribute('aria-pressed', b === target));

  s.options.forEach(o => {
    const b = btn(o, !otherOn && data[s.id] === o, () => {
      if (busy) return;
      data[s.id] = o; delete data[otherKey]; setErr(''); press(b);
      if (otherWrap) otherWrap.hidden = true;
      if (!nextId(s.id)){ next.hidden = false; next.textContent = 'ابعت الطلب'; return; }
      busy = true; setTimeout(forward, 220);
    });
  });

  let otherWrap = null;
  if (s.other){
    const ob = btn(s.other, otherOn, () => {
      data[otherKey] = true;
      if (!otherOn && s.options.includes(data[s.id])) data[s.id] = '';
      press(ob); otherWrap.hidden = false; next.hidden = false;
      next.textContent = nextId(s.id) ? 'التالي' : 'ابعت الطلب';
      inp.focus();
    });
    otherWrap = document.createElement('div');
    otherWrap.className = 'other'; otherWrap.hidden = !otherOn;
    const inp = document.createElement('input');
    inp.type = 'text'; inp.placeholder = 'اكتب هنا';
    inp.setAttribute('aria-label', s.other);
    inp.value = otherOn ? (data[s.id] || '') : '';
    inp.addEventListener('input', () => { data[s.id] = inp.value; setErr(''); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); next.click(); } });
    otherWrap.appendChild(inp);
    body.appendChild(otherWrap);
  }
  next.hidden = !(otherOn || (last && data[s.id]));
}

function commit(s){
  if (s.type === 'choice'){
    if (data[s.id + '__other']){
      const v = (data[s.id] || '').trim();
      if (!v) return setErr('اكتب إجابتك');
      data[s.id] = v;
    } else if (!data[s.id]) return setErr('اختار إجابة');
    return true;
  }
  const el = document.querySelector('#body input, #body textarea');
  let v = el.value.trim();
  if (s.norm) v = s.norm(v);
  if (!v){
    if (s.optional){ delete data[s.id]; return true; }
    return setErr('الخانة دي مطلوبة');
  }
  if (s.validate){ const r = s.validate(v); if (r !== true) return setErr(r); }
  data[s.id] = v;
  return true;
}
function setErr(m){ document.getElementById('err').textContent = m; return false; }

function submit(){
  const payload = {};
  STEPS.filter(shown).forEach(s => { if (data[s.id]) payload[s.id] = data[s.id]; });
  const next = document.getElementById('next');
  next.hidden = false; next.disabled = true; next.textContent = 'بيتبعت...';
  setErr('');
  const fail = (e) => {
    next.disabled = false; next.textContent = 'جرب تاني';
    next.onclick = submit;
    const why = e && e.error ? ' (' + e.error + ')' : (e && e.message ? ' (' + e.message + ')' : '');
    setErr('الطلب متبعتش. اتأكد من النت وجرب تاني.' + why);
  };
  if (!ENDPOINT){ setTimeout(() => thanks(payload), 600); return; } // وضع المعاينة
  fetch(ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  })
    .then(r => r.json())
    .then(r => r.ok ? thanks(payload) : fail(r))
    .catch(fail);
}

function thanks(p){
  hdr.hidden = true;
  const quote = p.wantsQuote === YES_QUOTE ? ' وهجهزلك التسعير المبدئي وأبعتهولك بعد ما أراجعه.' : '';
  view.innerHTML = `
    <section class="center screen">
      <img src="${LOGO}" alt="">
      <h1>وصلني طلبك</h1>
      <p id="msg"></p>
    </section>
    <p class="sig">م. إبراهيم الشلقاني</p>`;
  document.getElementById('msg').textContent = 'هكلمك على رقمك في الوقت اللي اخترته.' + quote;
}

intro();
</script>
</body>
</html>
